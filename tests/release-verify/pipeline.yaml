# Release-verification pipeline (RFC 024 W3). Rendered with:
#   PIPELINE_NAME=release-verify envsubst '$PIPELINE_NAME' < pipeline.yaml
# Uses the chart's built-in ComponentDefinitions (version omitted → defaultVersion).
name: ${PIPELINE_NAME}
stages:
  - name: extract
    components:
      - name: json-extractor
        component: http-json-extractor
        config:
          url: "https://jsonplaceholder.typicode.com/posts"
        outputs:
          defaultBucket: verify
          defaultWriteMode: FULL_LOAD
  - name: copy
    components:
      - name: sql-transform
        component: sql-transform
        inputs:
          tables:
            - bucket: verify
              table: data
        outputs:
          tables:
            - name: data_copy
              bucket: verify
              writeMode: FULL_LOAD
        config:
          sql: CREATE TABLE data_copy AS SELECT * FROM data
