# Keeps a run's Data Gateway sidecar alive for ~45 s (data-generator throttled
# to one row per 500 ms) so TestV3VariantPartitioned can port-forward to it
# and issue its own FORMAT_JSON read of the v3 events table.
name: "{{.RunPrefix}}-v3-variant-holder"
stages:
  - name: hold
    components:
      - name: holder
        component: data-generator
        version: dev
        config:
          tables:
            - name: tick
              rowInsertSpeed: 500
              random:
                schema: {id: int}
                limit:
                  rowsCount: 100000000
                  timeoutInSeconds: 45
        outputs:
          defaultBucket: "{{.RunPrefix}}-v3hold"
          defaultWriteMode: APPEND
