# Maintenance scenario (TestMaintenance_PipelineStage) seed: data-generator
# APPENDs 400 random rows into a bucket[8](id)-partitioned table. The test runs
# it twice, leaving 2 small files in each of 8 partitions (16 files).
name: "{{.RunPrefix}}-maintenance-seed"
stages:
  - name: generate
    components:
      - name: generator
        component: data-generator
        version: dev
        config:
          tables:
            - name: events
              random:
                schema: { id: long, payload: string }
                limit: { rowsCount: 400 }
        outputs:
          tables:
            - name: events
              bucket: "{{.RunPrefix}}-maint"
              writeMode: APPEND
              partitionSpec:
                - { source_column: id, transform: "bucket[8]" }
