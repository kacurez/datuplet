name: release-services

# Reusable: builds + manifests the six datuplet service images
# (pipeline-api, pipeline-observer, pipeline-operator, gateway,
# query-worker, app-worker). Each is a call to _release-image.yml. Called once
# from release.yml as the `services` job; appears as a collapsible group in the
# run-detail UI containing 18 flat entries (6 images × 3 sub-jobs).

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  pipeline-api:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: pipeline-api
      dockerfile: utils/docker/Dockerfile.pipeline-api
    secrets: inherit

  pipeline-observer:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: pipeline-observer
      dockerfile: utils/docker/Dockerfile.pipeline-observer
    secrets: inherit

  pipeline-operator:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: pipeline-operator
      dockerfile: utils/docker/Dockerfile.pipeline-operator
    secrets: inherit

  gateway:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: gateway
      dockerfile: utils/docker/Dockerfile.gateway
    secrets: inherit

  # query-worker (RFC 022): the ad-hoc SQL query service Deployment image,
  # referenced by datuplet-app's queryWorker.image. Distinct dockerfile path
  # (query-worker.Dockerfile, not Dockerfile.query-worker) — it bakes the
  # DuckDB iceberg/httpfs extensions, so it is CGO + multi-arch like gateway.
  query-worker:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: query-worker
      dockerfile: utils/docker/query-worker.Dockerfile
    secrets: inherit

  # app-worker (RFC 028): the user-apps render service Deployment image,
  # referenced by datuplet-app's appWorker.image. Pure-Go (wazero + the
  # committed engine.wasm), so a plain build like pipeline-api. Its Dockerfile
  # copies ui/appshell into the build context (the trusted viewer shell it
  # embeds).
  app-worker:
    uses: ./.github/workflows/_release-image.yml
    with:
      name: app-worker
      dockerfile: utils/docker/app-worker.Dockerfile
    secrets: inherit
