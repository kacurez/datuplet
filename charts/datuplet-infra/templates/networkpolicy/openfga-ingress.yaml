# charts/datuplet-infra/templates/networkpolicy/openfga-ingress.yaml
{{- if .Values.openfga.enabled }}
{{- /*
openfga-ingress NetworkPolicy.

Allows ports 8080 (HTTP) + 8081 (gRPC) only from named-component Pods.
authz-bootstrap (Job, part-of=datuplet) talks to openfga at install time;
lakekeeper, pipeline-api, reaper talk to it at runtime.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "datuplet-infra.prefix" . }}openfga-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datuplet-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Lakekeeper main Deployment. part-of=datuplet (datuplet-lakekeeper
        # chart overlay, last-key-wins over the subchart's part-of=lakekeeper —
        # which would match no pods); scope by name=lakekeeper.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: lakekeeper
        # Pipeline-api + reaper (Layer 2)
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: pipeline-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: pipeline-api-reaper
        # authz-bootstrap Job (Layer 1, runs at install time)
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: authz-bootstrap
        # Lakekeeper wait-for-fga-pin pre-install hook (Layer 4 bootstrap): polls
        # openfga:8080 for the model-version pin authz-bootstrap wrote. Without
        # this rule the hook can't reach openfga, loops 60x (its curl errors are
        # swallowed, so it prints a misleading "Waiting for FGA model pin"),
        # helm's pre-install --wait then times out and the datuplet-lakekeeper
        # install fails. Latent until a NetworkPolicy-enforcing CNI (Calico/
        # Cilium, most managed clouds, OrbStack k8s >= 1.35) actually enforces it.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: wait-for-fga-pin
        # Lakekeeper db-migration Job also runs an OpenFGA authorizer migration
        # ("Migrating authorizer..." -> lists/creates stores in the datuplet FGA
        # store) right after the Postgres migration. Its pod carries
        # part-of=lakekeeper (upstream subchart default), NOT the datuplet overlay
        # — same mismatch as the postgres-ingress db-migration rule — so match by
        # the stable component label. Without this the OpenFGA step fails with
        # "tcp connect error", the Job CrashLoops to backoffLimit, and the
        # lakekeeper install --wait times out. Latent until a NP-enforcing CNI.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lakekeeper
              app.kubernetes.io/component: db-migration
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
{{- end }}
