# charts/datuplet-infra/templates/networkpolicy/postgres-ingress.yaml
{{- /*
postgres-ingress NetworkPolicy.

Allows port 5432 only from named-component Pods. The selectors below
match what each chart actually emits:
  - lakekeeper (main Deployment) emits part-of=datuplet (the
    datuplet-lakekeeper chart overlays part-of, last-key-wins over the
    subchart default — so part-of=lakekeeper would match no pods)
  - openfga emits part-of=openfga
  - our Jobs + pipeline-api emit part-of=datuplet
Per-component name labels keep the allowlist explicit (no umbrella selector).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "datuplet-infra.prefix" . }}postgres-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datuplet-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "datuplet-infra.prefix" . }}pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Lakekeeper main Deployment. part-of=datuplet (chart overlay, not the
        # subchart's part-of=lakekeeper); scope by name=lakekeeper.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: lakekeeper
        # OpenFGA main Deployment + initContainer migrate (subchart, part-of=openfga)
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: openfga
              app.kubernetes.io/name: openfga
        # Pipeline-api Deployment + migrate Job + reaper (Layer 2, part-of=datuplet)
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: pipeline-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: pipeline-api-reaper
        # Pipeline-observer Deployment — same DB as
        # pipeline-api; reads/writes the runs table via the informer.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: datuplet
              app.kubernetes.io/name: pipeline-observer
        # Lakekeeper db-migration Job (lakekeeper subchart, runs `lakekeeper
        # migrate` at install time). Its pod carries part-of=lakekeeper (the
        # upstream subchart default) — NOT the part-of=datuplet overlay the main
        # catalog Deployment gets — so the name=lakekeeper,part-of=datuplet
        # selector above misses it. Match by the stable component label instead.
        # Without this the migration Job can't reach pg:5432, `lakekeeper migrate`
        # never runs, and the catalog Pod loops wait_for_db on NoMigrationsTable
        # until helm --wait times out. Latent until a NetworkPolicy-enforcing CNI.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lakekeeper
              app.kubernetes.io/component: db-migration
      ports:
        - { protocol: TCP, port: 5432 }
    # CloudNativePG operator -> instance-manager status endpoint (port 8000).
    # The operator scrapes https://<instance>:8000/pg/status every few seconds to
    # populate Cluster status. WITHOUT this rule, a NetworkPolicy-enforcing CNI
    # (Calico/Cilium, most managed clouds, and OrbStack k8s >= 1.35) silently
    # drops the connection and the Cluster wedges at "Instance Status Extraction
    # Error: HTTP communication issue" (dial tcp :8000: i/o timeout), which in
    # turn hangs the openfga-dsn wait-for-cnpg gate and the whole infra install.
    # The postgres Pod still reports Ready because kubelet probes :8000 from the
    # host, which NetworkPolicy does not filter. The operator ships in the
    # datuplet-operators chart, installed into this same namespace by
    # scripts/install.sh, so a same-namespace podSelector matches it.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - { protocol: TCP, port: 8000 }
