{{- /*
pipeline-observer egress NetworkPolicy.

Limits lateral movement blast radius if the observer Pod is compromised.
The observer has no legitimate reason to reach MinIO, OpenFGA, lakekeeper,
or pipeline-api directly — it talks to the K8s API and to Postgres only.

Ingress is unrestricted (allow Prometheus or other scrapers to hit /metrics
on the Service); operators wanting tighter ingress should add their own
NetworkPolicy via a downstream chart.
*/ -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "datuplet-app.prefix" . }}pipeline-observer-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datuplet-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: datuplet
      app.kubernetes.io/name: pipeline-observer
  policyTypes: ["Egress"]
  egress:
    # DNS — required for resolving the Postgres + K8s API Service DNS.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Postgres (CNPG primary Service). Same selector as
    # datuplet-infra/templates/networkpolicy/postgres-ingress.yaml uses
    # on the receiving side.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
      ports:
        - { protocol: TCP, port: 5432 }
    # K8s API server. We can't pod-select kube-apiserver (it's not a Pod
    # in the cluster), so allow the API ports to anywhere — the standard
    # NetworkPolicy idiom for in-cluster API access. Ports are configurable
    # (pipelineObserver.apiServerEgressPorts, default [443, 6443]) because some
    # clusters serve the API endpoint on a non-standard port and enforce egress
    # post-DNAT — e.g. OrbStack's endpoint is :26443, so the observer must be
    # allowed to reach that actual port or its PipelineRun watch is rejected and
    # it crashloops on cache-sync.
    #
    # Fail rendering on an empty list: a bare `- ports:` with no entries and no
    # `to` is read by Kubernetes as "egress to ANY destination on ANY port",
    # which would silently defeat this lockdown (fail-open). The observer always
    # needs the API server, so an empty list is never valid — surface it at
    # install time instead of shipping an accidental allow-all.
    {{- if not .Values.pipelineObserver.apiServerEgressPorts }}
    {{- fail "pipelineObserver.apiServerEgressPorts must be a non-empty list of API-server TCP ports (default [443, 6443]); an empty list renders an allow-all egress rule and defeats the pipeline-observer lockdown" }}
    {{- end }}
    - ports:
        {{- range .Values.pipelineObserver.apiServerEgressPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
