{{- if .Values.components.builtins }}
{{- /*
ComponentDefinition CR for the built-in iceberg-maintenance component. See
data-generator.yaml in this directory for the cluster-scoped naming rationale.
It asks the Data Gateway to compact each declared output table; the component
itself does no data I/O, so default resources stay small.
*/ -}}
---
apiVersion: datuplet.io/v1
kind: ComponentDefinition
metadata:
  name: iceberg-maintenance
  labels:
    {{- include "datuplet-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: iceberg-maintenance
spec:
  displayName: Iceberg Compactor
  description: Bin-packs the small data files of each declared output table into target-size files in one atomic snapshot. Old files stay until snapshots are expired.
  maintainer: datuplet
  io:
    inputs: none
    outputs: required
  defaultVersion: {{ .Values.components.tag }}
  versions:
    - version: {{ .Values.components.tag }}
      image: "{{ .Values.components.registry }}/iceberg-maintenance:{{ .Values.components.tag }}"
      configSchema: |
{{ .Files.Get (printf "files/component-schemas/%s.json" "iceberg-maintenance") | indent 8 }}
      resources:
        default:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        max:
          cpu: "1"
          memory: 512Mi
          ephemeral-storage: 1Gi
{{- end }}
